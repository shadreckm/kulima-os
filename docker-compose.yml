version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kulima_os
      POSTGRES_USER: kulima
      POSTGRES_PASSWORD: kulima_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      - DATABASE_URL=postgresql://kulima:kulima_secret@db:5432/kulima_os
      - DEBUG=False
    depends_on:
      - db
    restart: unless-stopped

  # Frontend (for future React/Next.js deployment)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile.frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

volumes:
  pgdata:
