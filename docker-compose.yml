version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./kulima_os.db:/app/kulima_os.db
    environment:
      - DATABASE_URL=sqlite:///./kulima_os.db
      - DEBUG=False
    restart: unless-stopped

